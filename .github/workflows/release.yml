name: Build and publish latest Windows release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mouseclicker-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install locked build dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-build.txt

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Build Windows executable
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name MouseClicker main.py

      - name: Smoke test packaged executable
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $executable = (Resolve-Path -LiteralPath "dist\MouseClicker.exe").Path
          $smokeProcess = Start-Process -FilePath $executable -WindowStyle Hidden -PassThru
          try {
              Start-Sleep -Seconds 3
              $smokeProcess.Refresh()
              if ($smokeProcess.HasExited) {
                  throw "MouseClicker.exe exited unexpectedly with code $($smokeProcess.ExitCode)"
              }
          } finally {
              if (-not $smokeProcess.HasExited) {
                  Stop-Process -Id $smokeProcess.Id -ErrorAction Stop
              }
          }

      - name: Generate SHA-256 checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath "dist\MouseClicker.exe").Hash.ToLowerInvariant()
          "$hash  MouseClicker.exe" | Set-Content -LiteralPath "dist\MouseClicker.exe.sha256" -Encoding ascii

      - name: Publish verified release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $releaseTag = "build-$env:GITHUB_RUN_NUMBER"
          $releaseTitle = "MouseClicker 最新版（构建 #$env:GITHUB_RUN_NUMBER）"
          $releaseNotes = @"
          这是 main 分支提交 $env:GITHUB_SHA 的自动构建。

          - 适用于 Windows 10/11
          - 无需安装 Python
          - 发布前已通过全部自动测试
          - 请使用随附的 `MouseClicker.exe.sha256` 校验下载文件
          "@

          & gh release view $releaseTag --repo $env:GITHUB_REPOSITORY *> $null
          $releaseExists = $LASTEXITCODE -eq 0

          if ($releaseExists) {
              & gh release upload $releaseTag "dist\MouseClicker.exe" "dist\MouseClicker.exe.sha256" --clobber --repo $env:GITHUB_REPOSITORY
              if ($LASTEXITCODE -ne 0) { throw "Failed to replace release assets" }
              & gh release edit $releaseTag --title $releaseTitle --notes $releaseNotes --latest --repo $env:GITHUB_REPOSITORY
              if ($LASTEXITCODE -ne 0) { throw "Failed to update release metadata" }
          } else {
              & gh release create $releaseTag "dist\MouseClicker.exe" "dist\MouseClicker.exe.sha256" --target $env:GITHUB_SHA --title $releaseTitle --notes $releaseNotes --latest --repo $env:GITHUB_REPOSITORY
              if ($LASTEXITCODE -ne 0) { throw "Failed to create release" }
          }
